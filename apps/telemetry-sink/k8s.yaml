---
# Cluster-side counterpart of the compose service, for the kind-based jobs.
# Expects a telemetry-sink ConfigMap holding run.py; see .github/workflows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-sink
  labels:
    app: telemetry-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-sink
  template:
    metadata:
      labels:
        app: telemetry-sink
    spec:
      containers:
        - name: telemetry-sink
          image: python:3.10-slim-bullseye
          command: ["python3", "/app/run.py"]
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: sink-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: sink-code
          configMap:
            name: telemetry-sink
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-sink
spec:
  selector:
    app: telemetry-sink
  ports:
    - port: 8080
      targetPort: 8080
